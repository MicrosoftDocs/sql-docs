title: Azure SQL Database free offer FAQ
summary: This article answers frequently asked questions on [the Azure SQL Database free offer](free-offer.md).
sections:
  - name: General
    questions: 
      - question: How long can I use the free offer?
        answer: |
         The database is free forever, with monthly limits. There's no time limit.

         Monthly usage limits are: 100,000 vCore seconds, 32 GB of data storage, and 32 GB of backup storage per free offer database. Each subscription can include up to 10 databases, and the same limits apply to each database individually.

      - question: What if I don't see the new offer and Apply Offer button?
        answer: |
         There's a limit of 10 free databases per subscription. If you reach the limit, remove an existing free database to create another one.

      - question: What if I delete a new offer database, can I get another?
        answer: |
         If you recently deleted a free offer database, it takes up to one hour for the slot to become available.

      - question: Help! I'm no longer able to sign in to my database.
        answer: |
         Check the overview page for the database [on the Azure portal](https://portal.azure.com) to see whether you have any remaining free credits for the month. If you choose the **Auto-pause the database until next month** option, once the free limits are met, the database in inaccessible until the start of the next calendar month. To continue usage with charges, go to the **Compute + Storage** tab and change the option to enable billing for usage of the database beyond the free amount.  

      - question: My vCore seconds are being used faster than I expected, how can I see what is using the vCore seconds?  
        answer: |
         - Track usage throughout the month with the "Free amount remaining" Azure Metric. For more information, see [Monitor and track service usage](free-offer.md#monitor-and-track-service-usage).
         - Review the Azure SQL Database serverless [auto-pause troubleshooting article](/azure/azure-sql/database/serverless-tier-overview?tabs=general-purpose#auto-pause-troubleshooting) for tips on saving vCore seconds. 
         - Disconnect querying tools such as [SQL Server Management Studio](/ssms/sql-server-management-studio-ssms), including the Object Explorer, when you're done using them. Leaving connections open can continue to consume credits by preventing auto-pause.

      - question: Can I restore a database to a free offer database?
        answer: |
         No. A free offer database is intended for new databases, the ability to restore an existing database to a free database is disabled.

      - question: Is the Azure SQL Database free offer a production quality database?  
        answer: |
         While a free offer database is built on the same General Purpose, production-quality infrastructure, the free amount doesn't come with a service level agreement (SLA) and is recommended primarily for development and proof-of-concept scenarios. Since there are no charges, there are no credits for downtime.

      - question: Can I upgrade to a larger or more powerful database?  
        answer: |
         Yes. At any time, you can upgrade the service tier or compute tier of the database. Select your database in the Azure portal, go to the **Compute and Storage** tab, then switch the **Free Database offer** options to **Continue using database with additional charges**. This option unlocks the ability to scale up to a larger General Purpose database. If you wish to change service tiers, you need to turn off the **Free database offer** before changing to Hyperscale or Business Critical service tiers. Once you convert a free offer database to a paid service tier, you can't revert to the free offer.

      - question: Can I change the backup option to geo-redundant storage?
        answer: |
         Yes, if you change the **Free limit reached behavior** setting to **Continue using for additional charges**.

      - question: Can I use my Student subscription with an Azure SQL Database free offer database?
        answer: |
         There are multiple student offers. Currently, the Microsoft Azure for Students Starter offer is incompatible with this Azure SQL Database free offer. Instead, consider the [Azure for College Students offer](https://azure.microsoft.com/pricing/offers/ms-azr-0170p?cid=msft_learn) or the [Azure Free offer](https://azure.microsoft.com/pricing/purchase-options/azure-account?cid=msft_learn). If desired, the **Continue using database for additional charges** option can deduct from the starting credits.

      - question: Will any unused vCore seconds in a month carry forward to the next month?
        answer: |
         No, vCore seconds for each free offer database reset at the start of each calendar month.

