title: Frequently asked questions for SQL Server on Linux virtual machines
summary: |
  [!INCLUDE[appliesto-sqlvm](../../includes/appliesto-sqlvm.md)]
  
  > [!div class="op_single_selector"]
  > * [Windows](../windows/frequently-asked-questions-faq.yml)
  > * [Linux](frequently-asked-questions-faq.yml)
  
  This article provides answers to some of the most common questions about running [SQL Server on Linux virtual machines](sql-server-on-linux-vm-what-is-iaas-overview.md).
  
  [!INCLUDE [support-disclaimer](../../includes/support-disclaimer.md)]
  

sections:
  - name: Images
    questions:
      - question: |
          What SQL Server virtual machine gallery images are available?
        answer: |
             Azure maintains virtual machine (VM) images for all supported major releases of SQL Server on Windows. For more information, see the complete list of [Windows VM images](../windows/sql-server-on-azure-vm-iaas-what-is-overview.md#sql-vm-images-and-licensing).

             Precreated SQL Server on Linux Azure Marketplace images are deprecated and no longer available for new deployments. Instead, start from a supported Linux base image, and Azure installs and configures SQL Server during VM provisioning by using a script-based approach. Azure portal deployment is currently in preview. For more information, see [Azure portal deployment](sql-server-on-linux-vm-what-is-iaas-overview.md#azure-portal-deployment).

      - question: |
          Which Linux distributions does Azure portal deployment support?
        answer: |
             Azure portal deployment supports Red Hat Enterprise Linux (RHEL) 9 and RHEL 10, and Ubuntu 22.04, Ubuntu 24.04, and Ubuntu 26.04. Later versions of these distributions are added automatically as they become supported. Azure portal deployment doesn't support SUSE Linux Enterprise Server (SLES), but you can create a SLES VM and install SQL Server yourself. For the current list, see [Supported Linux distributions](sql-server-on-linux-vm-what-is-iaas-overview.md#supported-linux-distributions).

      - question: |
          What related SQL Server packages are also installed?
        answer: |
             To see the SQL Server packages that are installed by default on SQL Server on Linux, see [Install SQL Server on Linux](/sql/linux/install-upgrade/setup).

  - name: Creation
    questions:
      - question: |
          How do I create a Linux virtual machine with SQL Server?
        answer: |
             Use the SQL Server on Azure VM deployment experience in the Azure portal. Start from either the **Create a virtual machine** page or the [Azure SQL hub](https://aka.ms/azuresqlhub), choose a supported Linux base image, and configure SQL Server. Azure installs and configures SQL Server and registers the VM with the SQL Server IaaS Agent extension. For steps, see [Provision a Linux virtual machine running SQL Server in the Azure portal](sql-vm-create-portal-quickstart.md).

             You can also manually install SQL Server on a Linux VM. If you bring your own license, you must have [License Mobility through Software Assurance on Azure](https://azure.microsoft.com/pricing/license-mobility).

      - question: |
          Can I use my own mssql.conf file during deployment?
        answer: |
             Yes. During SQL Server on Azure VM deployment, you can configure SQL Server options in the Azure portal, or upload a custom `mssql.conf` file. For more information about `mssql.conf` settings, see [Configure SQL Server on Linux with the mssql-conf tool](/sql/linux/sql-server-linux-configure-mssql-conf).

      - question: |
          Why can't I provision an RHEL or SLES SQL Server VM with an Azure subscription that has a spending limit?
        answer: |
             RHEL and SLES virtual machines require a subscription with no spending limit and a verified payment method (usually a credit card) associated with the subscription. If you deploy an RHEL or SLES VM without removing the spending limit, your subscription gets disabled and all VMs/services stopped. If you do run into this state, to re-enable the subscription [remove the spending limit](https://account.windowsazure.com/subscriptions). Your remaining credits will be restored for the current billing cycle but an RHEL or SLES VM image surcharge will go against your credit card if you choose to restart and continue running it.
          
  - name: Licensing
    questions:
      - question: |
          How can I use my own SQL Server license on an Azure VM?
        answer: |
             During SQL Server on Azure VM portal deployment, select **Azure Hybrid Benefit** as the licensing model. You can also create a Linux OS-only virtual machine, run the [SQL Server installation steps](/sql/linux/sql-server-linux-setup#platforms) for your Linux distribution, and then [register the VM with the SQL IaaS Agent extension](sql-iaas-agent-extension-register-vm-linux.md). Unless you're installing one of the freely licensed editions of SQL Server, you must have a SQL Server license and [License Mobility through Software Assurance on Azure](https://azure.microsoft.com/pricing/license-mobility/).

      - question: |
          Can I switch between pay-as-you-go and Azure Hybrid Benefit after deployment?
        answer: |
             Yes, if the VM is registered with the [SQL Server IaaS Agent extension](sql-server-iaas-agent-extension-linux.md). VMs created by using the SQL Server on Azure VM portal deployment experience are registered automatically. The change takes effect immediately, doesn't cost extra, and doesn't restart the VM or the SQL Server service.

             - **Azure portal**: Go to your **SQL virtual machine** resource. Under **Settings**, select **SQL Server configuration**, and then select **Manage**.
             - **Azure CLI**: Run `az sql vm update -n <VM_NAME> -g <RESOURCE_GROUP> --license-type AHUB`.
             - **Azure PowerShell**: Run `Set-AzSqlVM -Name <VM_NAME> -ResourceGroupName <RESOURCE_GROUP> -LicenseType AHUB`.

             To switch back to pay-as-you-go, use `PAYG` as the license type.

  - name: Administration
    questions:
      - question: |
          Can I manage a Linux virtual machine running SQL Server with SQL Server Management Studio (SSMS)?
        answer: |
             Yes, but SSMS is currently a Windows-only tool. You must connect remotely from a Windows machine to use SSMS with Linux VMs running SQL Server. Locally on Linux, the [mssql-conf](/sql/linux/sql-server-linux-configure-mssql-conf) tool can perform many administrative tasks. For a cross-platform database management tool, see the [MSSQL extension for Visual Studio Code](/sql/tools/visual-studio-code-extensions/mssql/mssql-extension-visual-studio-code).
          
      - question: |
          Can I remove SQL Server completely from a SQL Server VM?
        answer: |
             Yes, but you'll continue to be charged for your SQL Server VM as described in [Pricing guidance for SQL Server Azure VMs](../windows/pricing-guidance.md?toc=%2fazure%2fvirtual-machines%2flinux%2fsql%2ftoc.json). If you no longer need SQL Server, you can deploy a new virtual machine and migrate the data and applications to the new virtual machine. Then you can remove the SQL Server virtual machine.
          
  - name: Updating and patching
    questions:
      - question: |
          How do I upgrade to a new version/edition of the SQL Server in an Azure VM?
        answer: |
             You can upgrade to a new version or edition of SQL Server on your SQL Server on Azure VM by using the desired setup media. Once your SQL Server has been upgraded, [delete the extension](../windows/sql-agent-extension-manually-register-single-vm.md#delete-the-extension) from the VM, and then [re-register](../windows/sql-agent-extension-manually-register-single-vm.md#register-with-extension) your SQL Server on Azure VM with the SQL IaaS Agent extension once more to accurately reflect the new version or edition of SQL Server in the Azure portal. 
          
  - name: General
    questions:
      - question: |
          Are SQL Server high-availability solutions supported on Azure VMs?
        answer: |
             Yes. You can configure Always On availability groups for SQL Server on Linux VMs by using a cluster manager such as Pacemaker. For steps, see the tutorials for [RHEL](rhel-high-availability-fencing-tutorial.md), [SLES](sles-high-availability-fencing-tutorial.md), and [Ubuntu](ubuntu-high-availability-fencing-tutorial.md). The Azure portal deployment experience doesn't configure high availability, so you set it up after you deploy the VMs.
      - question: |
          Is SQL Server on Azure Linux VMs FIPS compliant?
        answer:    Not at this time. Use a Windows Server 2019 or 2022 virtual machine in Azure to be [FIPS](../windows/security-considerations-best-practices.md#fips-compliance) compliant. 

